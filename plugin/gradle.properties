pluginVersion=0.5.1
# Compile and test platform: IU, because Rider cannot run BasePlatformTestCase
platformVersion=2026.2.1
# 2026.3 moved XML and HTML out of the platform into a bundled plugin, so compiling against it also
# takes -PplatformBundledPlugins=com.intellij.xml. 2026.2 has no such plugin, hence not set here.
# Target IDE for manual verification via ./gradlew runRider
riderVersion=2026.2.1
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx4096m
org.gradle.caching=true

# The closed until-build is deliberate - see the reasoning in build.gradle.kts - and the
# verifier advises against it on every run. Muted so that the warning left standing beside it,
# about the Java version, still reads as something to act on.
org.jetbrains.intellij.platform.verifyPluginProjectConfigurationMutedMessages=until-build property should be removed

# The IDEs ./gradlew verifyPlugin checks the plugin against: the newest build of each branch in
# the range. It is the same check Marketplace runs on upload, only earlier.
verifyRiderVersions=2026.2.4,2026.3-EAP9-SNAPSHOT
